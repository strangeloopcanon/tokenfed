[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenfed"
version = "1.0.0"
description = "TokenFed: Multi-Sector GPU Compute Clearing & Working-Capital Governance Simulation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8", "numpy>=1.26"]

[tool.setuptools]
packages = ["token_fed"]
